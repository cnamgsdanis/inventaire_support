<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
    <meta charset="UTF-8">
    <title>Gestion des Produits</title>
    <!-- Le lien magique pour avoir une belle page (Bootstrap) -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
</head>
<body class="bg-light">
<div class="container mt-5">
    <div class="card shadow">
        <div class="card-header bg-primary text-white d-flex justify-content-between">
            <h2>📦 Liste des Produits</h2>
            <a href="/ajouter" class="btn btn-light">➕ Ajouter un produit</a>
        </div>
        <div class="card-body">
            <table class="table table-striped">
                <thead>
                    <tr>
                        <th>ID</th>
                        <th>Nom</th>
                        <th>Prix (€)</th>
                        <th>Quantité</th>
                        <th>Actions</th>
                    </tr>
                </thead>
                <tbody>
                    <tr th:each="produit : ${listeProduits}">
                        <td th:text="${produit.id}"></td>
                        <td th:text="${produit.nom}"></td>
                        <td th:text="${produit.prix}"></td>
                        <td th:text="${produit.quantite}"></td>
                        <td>
                            <a th:href="@{/modifier/{id}(id=${produit.id})}" class="btn btn-warning btn-sm">✏️ Modifier</a>
                            <a th:href="@{/supprimer/{id}(id=${produit.id})}" class="btn btn-danger btn-sm" onclick="return confirm('Vraiment supprimer ?')">🗑️ Supprimer</a>
                        </td>
                    </tr>
                </tbody>
            </table>
        </div>
    </div>
</div>
</body>
</html>
